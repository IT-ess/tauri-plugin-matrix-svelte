[package]
name = "matrix-svelte-client"
version.workspace = true
description = "A Matrix client using tauri-plugin-matrix-svelte"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "matrix_svelte_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
anyhow.workspace = true
rustls-platform-verifier = "0.7.1"
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-matrix-svelte = { path = "../../../" }
serde.workspace = true
serde_json.workspace = true
mime_serde_shim.workspace = true
serde_urlencoded = "0.7.1"
tauri-plugin-clipboard-manager = "2.4.1"
tauri-plugin-dialog.workspace = true
tauri-plugin-deep-link = "2.6.1"
tauri-plugin-fs = "2.6.0"
# Path-sourced from the repo-root git submodule (see [workspace.dependencies]).
tauri-plugin-notifications.workspace = true
tauri-plugin-opener = "2.7.0"
tauri-plugin-os = "2.4.0"
tauri-plugin-persisted-scope = "2.4.0"
tauri-plugin-safe-area-insets-css = "0.2.0"
tauri-plugin-svelte.workspace = true
tauri-plugin-single-instance = { version = "2.5.0", features = ["deep-link"] }
time = "0.3.44"
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["time", "env-filter"] }

[target."cfg(any(target_os = \"android\", target_os = \"ios\"))".dependencies]
tauri-plugin-sharekit = { git = "https://github.com/IT-ess/tauri-plugin-sharekit", branch = "android-target", default-features = false }
# Used by the shared silent-push helpers (`push_shared.rs`) to encode avatars.
base64.workspace = true

[target."cfg(target_os = \"android\")".dependencies]
jni = "0.21.1"
# rustls-platform-verifier 0.7 speaks jni 0.22 while wry/tauri-plugin-notifications are on 0.21;
# see `init_platform_verifier` in push_handler.rs.
jni_022 = { package = "jni", version = "0.22" }
# Borrowed by the silent-push init hook to build the keyring store (`push_handler.rs`).
ndk-context = "0.1.1"
tokio = "1.53.1"
tauri-plugin-android-fs.workspace = true
# Routes the cold-path (killed-state) silent-push `tracing` output to logcat,
# since the Tauri runtime's logging setup never runs in that path.
paranoid-android = "0.2"

[target."cfg(target_os = \"ios\")".dependencies]
# Runtime for the Notification Service Extension's silent-push handler
# (`ios_push.rs`), which drives the async Matrix fetch without a Tauri runtime.
tokio = { version = "1.53.1", features = ["rt"] }
tauri-plugin-web-auth = "1.0.0"

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-devtools = "2.2.1"
